name: Deadlock research harness
on:
  push:
    paths:
      - 'Research/DeadlockMovement/**'
      - '.github/workflows/deadlock-research.yml'
  pull_request:
    paths:
      - 'Research/DeadlockMovement/**'
      - '.github/workflows/deadlock-research.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: Research/DeadlockMovement
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python research.py compare examples/synthetic-reference.csv examples/synthetic-candidate.csv
